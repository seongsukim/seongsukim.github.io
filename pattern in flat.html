<head>

  <title>Pattern in Flat — Seongsu Kim</title>
  <style>
    :root { --unit:162px; --gap:12px; --amber:#f3c6a6; --blue:#c5c9ed; --violet:#dbcbb9; --grey:rgba(220,220,220,.86); }
    *,*::before,*::after { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:#000; font-family:Arial,Helvetica,sans-serif; background:#c9c9c9; }
    body.animations-paused { background-image:none; background-color:#c9c9c9; }
    a { color:#000; text-decoration:underline; text-underline-offset:2px; }
    a:hover { color:#fff; background:#000; }
    a:focus-visible,button:focus-visible { outline:3px solid #000; outline-offset:2px; }
    .layout { display:grid; grid-template-columns:calc(var(--unit) * 2) minmax(0,calc(var(--unit) * 4 + var(--gap) * 3)); gap:var(--gap); width:min-content; min-width:100%; align-items:start; }
    .sidebar { position:sticky; top:0; z-index:3; width:calc(var(--unit) * 2); min-height:100vh; padding:var(--gap); background:linear-gradient(180deg,rgba(240,240,240,.94),rgba(190,190,190,.84)); }
    .identity { margin-bottom:36px; font-size:15px; line-height:1.15; }
    .identity strong { display:block; font-size:20px; }
    .pause-button { width:100%; margin:0 0 var(--gap); padding:9px 8px; border:2px solid #000; border-radius:0; background:linear-gradient(90deg,var(--violet),#f0e8ff); color:#000; font:inherit; font-weight:bold; text-align:left; cursor:pointer; }
    .nav-box { padding:14px 12px 20px; background:linear-gradient(145deg,#e4f6ff 0%,var(--blue) 58%,#50ace4 100%); }
    .nav-box a { display:block; width:max-content; max-width:100%; margin-bottom:14px; font-size:16px; line-height:1.15; }
    .nav-box a:last-child { margin-bottom:0; }
    main { position:relative; z-index:1; display:grid; grid-template-columns:repeat(4,var(--unit)); grid-auto-flow:row dense; gap:var(--gap); width:calc(var(--unit) * 4 + var(--gap) * 3); padding:var(--gap) 0 100px; }
    .title { grid-column:1/-1; padding:22px 28px 27px; background:linear-gradient(105deg,var(--amber) 0%,#ffd765 62%,#fff1b8 100%); overflow:hidden; }
    h1 { margin:0; font-size:clamp(50px,5.7vw,90px); font-weight:800; line-height:.82; letter-spacing:-.065em; text-transform:uppercase; }
    .back { grid-column:1/-1; padding:12px; background:linear-gradient(90deg,rgba(255,255,255,.98),rgba(228,246,255,.86)); text-align:right; }
    .intro { grid-column:1/span 2; padding:16px; background:linear-gradient(145deg,#efe7ff 0%,var(--violet) 58%,#a77dff 100%); font-size:27px; font-weight:bold; line-height:1.06; }
    .intro p { margin:0; }
    .details { grid-column:3/-1; padding:16px; background:linear-gradient(155deg,#e5f7ff 0%,var(--blue) 56%,#45a6df 100%); font-size:13px; line-height:1.45; }
    .details dl { display:grid; grid-template-columns:70px 1fr; gap:8px 12px; margin:0; }
    .details dt,.details dd { margin:0; }
    .essay { grid-column:1/-1; display:grid; grid-template-columns:1fr; gap:1px; background:#000; }
    .essay div { padding:18px; background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(232,246,255,.92)); font-size:14px; line-height:1.45; }
    .essay p { margin:0 0 14px; }
    .essay p:last-child { margin-bottom:0; }
    .section-title { grid-column:1/-1; padding:11px 14px; background:linear-gradient(90deg,var(--amber),#fff0a8); }
    .section-title h2 { margin:0; font-size:28px; line-height:1; text-transform:uppercase; }
    .gallery { grid-column:1/-1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--gap); align-items:start; }
    .gallery figure { display:flex; flex-direction:column; min-width:0; }
    .gallery figure:last-child:nth-child(odd) { grid-column:1/-1; }
    .quote { grid-column:1/-1; padding:18px; background:linear-gradient(110deg,#efe7ff,var(--violet) 60%,#a77dff); font-size:23px; font-weight:bold; line-height:1.12; }
    .quote p { margin:0; }
    figure { margin:0; background:#fff; }
    figure img { display:block; width:100%; height:auto; cursor:zoom-in; }
    figcaption { display:flex; justify-content:space-between; gap:16px; padding:7px 9px 9px; background:linear-gradient(90deg,#fff,#e9e9e9); font-size:11px; }
    .wide { grid-column:1/-1; }
    .half { grid-column:span 2; }
    .footer { grid-column:1/-1; display:flex; justify-content:space-between; padding:12px; background:linear-gradient(90deg,rgba(239,239,239,.96),rgba(187,187,187,.86)); font-size:12px; }
    .lightbox { width:100vw; max-width:none; height:100vh; max-height:none; margin:0; padding:0; border:0; background:transparent; color:#fff; overflow:hidden; }
    .lightbox[open] { display:grid; grid-template-columns:64px minmax(0,1fr) 64px; align-items:center; }
    .lightbox::backdrop { background:rgba(0,0,0,.94); }
    .lightbox-image { display:block; max-width:100%; max-height:calc(100vh - 86px); margin:auto; object-fit:contain; }
    .lightbox-caption { position:fixed; left:20px; right:20px; bottom:14px; color:#fff; font-size:12px; text-align:center; }
    .lightbox button { border:0; border-radius:0; background:transparent; color:#fff; font:32px Arial,Helvetica,sans-serif; cursor:pointer; }
    .lightbox button:hover { color:var(--amber); }
    .lightbox-close { position:fixed; top:12px; right:18px; z-index:2; width:44px; height:44px; font-size:30px!important; }
    .lightbox-prev,.lightbox-next { align-self:stretch; }
    @media (max-width:900px) { body { background-size:280px auto; } .layout { display:block; width:100%; min-width:0; } .sidebar { position:relative; width:100%; min-height:0; } .identity { margin-bottom:18px; } main { grid-template-columns:repeat(2,minmax(0,1fr)); width:100%; padding:var(--gap); } .title,.back,.intro,.details,.essay,.section-title,.gallery,.quote,.wide,.footer { grid-column:1/-1; } .half { grid-column:span 1; } h1 { font-size:clamp(48px,14vw,86px); } }
    @media (max-width:520px) { body { background-size:240px auto; } main { grid-template-columns:1fr; } .title,.back,.intro,.details,.essay,.section-title,.gallery,.quote,.wide,.half,.footer { grid-column:1; } .essay,.gallery { grid-template-columns:1fr; } .gallery figure:last-child:nth-child(odd) { grid-column:1; } .footer { flex-direction:column; gap:8px; } }
  .source-sheet { background:#fff; padding:12px; } .source-sheet summary { cursor:pointer; font-size:13px; padding:8px 0; } .source-sheet[open] summary { margin-bottom:12px; } h1 { line-height:.95; } figcaption { flex-wrap:wrap; }
</style>
</head>

  <dialog class="lightbox" aria-label="Expanded image viewer"><button class="lightbox-prev" type="button" aria-label="Previous image">‹</button><img class="lightbox-image" alt=""><button class="lightbox-next" type="button" aria-label="Next image">›</button><button class="lightbox-close" type="button" aria-label="Close image">×</button><div class="lightbox-caption"></div></dialog>
  <script>
    const images=[...document.querySelectorAll('figure img')];
    const lightbox=document.querySelector('.lightbox');
    const enlarged=lightbox.querySelector('.lightbox-image');
    const lightboxCaption=lightbox.querySelector('.lightbox-caption');
    let current=0;
    function show(index){ current=(index+images.length)%images.length; const image=images[current]; enlarged.src=image.currentSrc||image.src; enlarged.alt=image.alt; lightboxCaption.textContent=image.closest('figure').querySelector('figcaption').textContent.trim(); }
    images.forEach((image,index)=>{ const open=()=>{show(index);lightbox.showModal();}; image.addEventListener('click',open); image.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open();}}); });
    lightbox.querySelector('.lightbox-prev').addEventListener('click',()=>show(current-1));
    lightbox.querySelector('.lightbox-next').addEventListener('click',()=>show(current+1));
    lightbox.querySelector('.lightbox-close').addEventListener('click',()=>lightbox.close());
    lightbox.addEventListener('click',event=>{ if(event.target===lightbox) lightbox.close(); });
    document.addEventListener('keydown',event=>{ if(!lightbox.open)return; if(event.key==='ArrowLeft')show(current-1); if(event.key==='ArrowRight')show(current+1); });
  </script>
